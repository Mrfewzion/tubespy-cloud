name: Sync YouTube Stats (R2)

# Schedule: every 30 min, deliberately, WITH a freshness guard.
#
# Measured delivery for this repo over all 394 scheduled runs (Aug 11 - Oct 4
# 2026). The break is the DATE, not the cron:
#
#   Aug 12 - Aug 26   cron '0 */2 * * *'  -> 11.87/day delivered (98.9%)
#   Aug 27 - Sep  7   cron '0 */2 * * *'  ->  4.95/day delivered (41.2%)   <-- CLIFF
#   Sep  7 - Oct  3   cron '*/30 * * * *' ->  5.96/day delivered
#
# The cron was IDENTICAL either side of the cliff, so the expression cannot be
# the cause: GitHub's Actions cron scheduler degraded for this repo on
# 2026-08-26/27 and delivers a fraction of whatever is requested. Two more
# measurements pin it down:
#
#   * created_at == started_at on 400/400 runs, max queue delay 0 s. The runs
#     are not waiting in a runner queue; the scheduler is failing to CREATE
#     them. Moving off the top of the hour cannot help.
#   * The offset from the requested slot changed shape. Healthy: peaked at
#     10-29 min and decayed (a queue delay). Degraded: flat across the whole
#     120-min window - a random time, not a late one.
#
# An earlier note here said GitHub "silently DROPS sub-hourly crons for this
# repo". That was wrong, and it ruled out the fix. The natural experiment on
# Sep 7 settles it: the 10 days before that change asked for 12 slots/day and
# delivered 5.30/day; the 10 days after asked for 48 and delivered 6.50/day.
# Asking for MORE slots delivered MORE runs. See OpenCodeLog.md #270, which
# retracts #269.
#
# So: ask often (a missed slot is cheap to recover from, because the next
# wake-up is minutes away rather than 2 h away) and let the guard decide which
# wake-ups are actually due. That is the only lever left while GitHub's
# scheduler is degraded. Expected result is ~6.5 collections/day vs ~4.1 now -
# a real gain, NOT the 12/day the cron requests. Do not read the cron as a
# contract; read OpenCodeLog #270 for the measured delivery rate.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Runs on EVERY event, deliberately. It costs one head-object request.
      #
      # An earlier version gated this whole step on
      # `github.event_name == 'schedule'` so workflow_dispatch would force a
      # collection. That was correct about the DECISION and wrong about the STEP:
      # it meant no manual run ever executed the guard, so its first shipped
      # version reached production untested and died in 15 s with a KeyError that
      # only a scheduled event could hit (run 37203657581). The skip decision is
      # event-aware now, inside guard_main, so a dispatch always collects AND a
      # dispatch always verifies this code.
      - name: Freshness guard
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          AWS_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          LAST=$(aws s3api head-object \
                   --bucket "${AWS_BUCKET}" --key cloud.db \
                   --endpoint-url "${AWS_ENDPOINT_URL}" \
                   --query LastModified --output text 2>/dev/null || true)
          CLOUD_DB_LASTMODIFIED="$LAST" python -c "
          import os, sys
          sys.path.insert(0, '.')
          from sync_collector import guard_main
          raise SystemExit(guard_main(
              os.environ.get('CLOUD_DB_LASTMODIFIED'), os.environ['GITHUB_ENV'],
              event=os.environ.get('GITHUB_EVENT_NAME', 'schedule')))
          "

      - name: Download cloud.db (abort if download fails)
        if: env.SKIP != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          AWS_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if aws s3 ls "s3://${AWS_BUCKET}/cloud.db" --endpoint-url "${AWS_ENDPOINT_URL}" >/dev/null 2>&1; then
            aws s3 cp "s3://${AWS_BUCKET}/cloud.db" ./cloud.db --endpoint-url "${AWS_ENDPOINT_URL}"
          else
            echo "No cloud.db yet - starting fresh"
          fi

      - name: Download app sidecars (may not exist yet)
        if: env.SKIP != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          AWS_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws s3 cp "s3://${AWS_BUCKET}/channels.json" ./channels.json --endpoint-url "${AWS_ENDPOINT_URL}" || true
          aws s3 cp "s3://${AWS_BUCKET}/catalog.json" ./catalog.json --endpoint-url "${AWS_ENDPOINT_URL}" || true
          aws s3 cp "s3://${AWS_BUCKET}/snapshot_targets.json" ./snapshot_targets.json --endpoint-url "${AWS_ENDPOINT_URL}" || true

      - name: Run collector
        if: env.SKIP != 'true'
        run: python sync_collector.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          HTTP_TIMEOUT_SECONDS: '60'
          HTTP_RETRIES: '5'
          HTTP_BACKOFF_BASE: '1'

      - name: Verify integrity before upload
        if: env.SKIP != 'true'
        run: |
          python -c "import sqlite3; c=sqlite3.connect('cloud.db'); assert c.execute('PRAGMA integrity_check').fetchone()[0]=='ok', 'integrity check failed'"

      - name: Upload cloud.db (atomic temp key + copy)
        if: env.SKIP != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          AWS_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          TS=$(date +%s)
          aws s3 cp ./cloud.db "s3://${AWS_BUCKET}/cloud.db.tmp-${TS}" --endpoint-url "${AWS_ENDPOINT_URL}"
          aws s3api copy-object \
            --bucket "${AWS_BUCKET}" \
            --copy-source "${AWS_BUCKET}/cloud.db.tmp-${TS}" \
            --key cloud.db \
            --endpoint-url "${AWS_ENDPOINT_URL}"
          aws s3 rm "s3://${AWS_BUCKET}/cloud.db.tmp-${TS}" --endpoint-url "${AWS_ENDPOINT_URL}"
          echo "cloud.db updated"
