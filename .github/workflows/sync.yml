name: Sync YouTube Stats (R2)

# Heartbeat every 30 min instead of a bare 2h cron: GitHub's scheduler delays
# and silently skips scheduled runs under load (observed 6h gaps), so 48 cheap
# checks/day self-heal a skipped slot at the next tick. The freshness guard
# below keeps the REAL collection cadence at ~2h - YouTube quota and R2 write
# volume are unchanged.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Fail-open guard: any error here proceeds to collect, never blocks.
      # Manual dispatches bypass it (force-refresh always works).
      - name: Freshness guard (skip heartbeat if cloud.db < 100 min old)
        if: github.event_name == 'schedule'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          AWS_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          HEAD=$(aws s3api head-object --bucket "${AWS_BUCKET}" --key cloud.db --endpoint-url "${AWS_ENDPOINT_URL}" 2>/dev/null || true)
          LAST=$(printf '%s' "$HEAD" | python3 -c "import sys,json,datetime
          try:
              d = json.load(sys.stdin)
              print(int(datetime.datetime.fromisoformat(d['LastModified'].replace('Z', '+00:00')).timestamp()))
          except Exception:
              print('')")
          NOW=$(date +%s)
          if [ -n "$LAST" ] && [ $(( NOW - LAST )) -lt 6000 ]; then
            echo "cloud.db is $(( (NOW - LAST) / 60 )) min old (<100) - no-op heartbeat"
            echo "SKIP=true" >> "$GITHUB_ENV"
          else
            echo "cloud.db age=${LAST:+$(( (NOW - LAST) / 60 )) min}${LAST:-missing (first run)} - collecting"
            echo "SKIP=false" >> "$GITHUB_ENV"
          fi
          exit 0

      - uses: actions/checkout@v5
        if: env.SKIP != 'true'
      - uses: actions/setup-python@v5
        if: env.SKIP != 'true'
        with:
          python-version: '3.13'
      - name: Install dependencies
        if: env.SKIP != 'true'
        run: pip install -r requirements.txt

      - name: Download cloud.db (abort if download fails)
        if: env.SKIP != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          AWS_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if aws s3 ls "s3://${AWS_BUCKET}/cloud.db" --endpoint-url "${AWS_ENDPOINT_URL}" >/dev/null 2>&1; then
            aws s3 cp "s3://${AWS_BUCKET}/cloud.db" ./cloud.db --endpoint-url "${AWS_ENDPOINT_URL}"
          else
            echo "No cloud.db yet - starting fresh"
          fi

      - name: Download app sidecars (may not exist yet)
        if: env.SKIP != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          AWS_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws s3 cp "s3://${AWS_BUCKET}/channels.json" ./channels.json --endpoint-url "${AWS_ENDPOINT_URL}" || true
          aws s3 cp "s3://${AWS_BUCKET}/catalog.json" ./catalog.json --endpoint-url "${AWS_ENDPOINT_URL}" || true
          aws s3 cp "s3://${AWS_BUCKET}/snapshot_targets.json" ./snapshot_targets.json --endpoint-url "${AWS_ENDPOINT_URL}" || true

      - name: Run collector
        if: env.SKIP != 'true'
        run: python sync_collector.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          HTTP_TIMEOUT_SECONDS: '60'
          HTTP_RETRIES: '5'
          HTTP_BACKOFF_BASE: '1'

      - name: Verify integrity before upload
        if: env.SKIP != 'true'
        run: |
          python -c "import sqlite3; c=sqlite3.connect('cloud.db'); assert c.execute('PRAGMA integrity_check').fetchone()[0]=='ok', 'integrity check failed'"

      - name: Upload cloud.db (atomic temp key + copy)
        if: env.SKIP != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          AWS_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          TS=$(date +%s)
          aws s3 cp ./cloud.db "s3://${AWS_BUCKET}/cloud.db.tmp-${TS}" --endpoint-url "${AWS_ENDPOINT_URL}"
          aws s3api copy-object \
            --bucket "${AWS_BUCKET}" \
            --copy-source "${AWS_BUCKET}/cloud.db.tmp-${TS}" \
            --key cloud.db \
            --endpoint-url "${AWS_ENDPOINT_URL}"
          aws s3 rm "s3://${AWS_BUCKET}/cloud.db.tmp-${TS}" --endpoint-url "${AWS_ENDPOINT_URL}"
          echo "cloud.db updated"
